/* 셀렉터 선택
 $("#id"), ${"tag"}, ${"*"} : 모든 요소 선택
 $(" parent > child") : 특정 부모의 아래 자식
 $("element:first") ,,, 기타 연산2ㅏ
 */


    //case2 . 태그 이벤트 함수
    //hover(), click()
    $("p").hover(
        function() {
            $(this).css("color", "red");
        },
        function() {
            $(this).css("color", "black");
        }
    ).click(function() {
        $(this).css("color", "blue");
    });

    </script>
