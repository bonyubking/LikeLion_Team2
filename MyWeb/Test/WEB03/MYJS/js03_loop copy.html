<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
  <title>반복문</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    color: #333;
  }
  .result{margin : 10px; padding: 10px;}
</style>
</head>
<body>
  <h2> 숫자 입력하고 버튼 클릭해보기</h2>
  <input type ="number" id ="number" placeholder ="숫자입력">
  <button onclick="runloop()">  클릭 </button>

  <h3> 반복문 결과 </h3>
  <div id="result" class ="result"></div>
  <script>
    function runloop(){
      const num = document.getElementById("number").value;
      
      if (isNaN(num) || num < 0){
          alert("양수를 입력하세요");
          return;
      }
      let forOutput = "";
      for (let i = 1; i <= num; i++) {
        forOutput += i+ " ";
      }

      document.getElementById("result").textContent = forOutput;
  }
  </script>
</body>
</html>
