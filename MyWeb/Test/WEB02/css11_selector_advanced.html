<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>고급 선택자 실습</title>
  <style>
    div p:first-of-type { color: blue; }
    p:nth-of-type(2) { color: orange; }
    li:first-child { color: red; }
    li:last-child { color: green; }
    li:nth-child(odd) { background-color: #f0f0f0; }
    input[type="text"] { border: 2px solid blue; }
    p:not(.highlight) { color: rgb(161, 7, 7); }
  </style>
</head>
<body>
  <div>
    <h1>abc</h1>
    <p>1</p>
    <p>2</p>
    <p>3</p>
    <p>4</p>
  </div>
  <h2>고급 선택자 실습</h2>
  <ul>
    <li>첫 번째 항목</li>
    <li>두 번째 항목</li>
    <li>세 번째 항목</li>
  </ul>
  <input type="text" placeholder="텍스트 입력">
  <input type="checkbox"> 체크박스
  <p>일반 문단</p>
  <p class="highlight">강조 문단</p>
</body>
</html>
