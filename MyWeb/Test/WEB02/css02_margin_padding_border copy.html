<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>여백과 테두리</title>
  <style>
    .parent {
      margin: 30px; 
      padding: 20px;
      border: 2px dashed #888;
      background-color: #e0f7fa;
    }
    /* border : inherit; 부모 속성 상속
      border : initial; 부모 속성 초기화
      border : unset; 상황에 따라 상속 초기화
    */

    .inherit {
      border: inherit;
    }
    .initial {
      border: initial;
    }
    .unset {
      border: unset;
    }
    .demo {
      margin: 10;
      padding: 10px;
      background-color: #8b1e1e;
    }
  </style>
</head>
<body>
  <div class = "parent"> 부모 박스 
    <div class="demo inherit">border: inherit;</div>
    <div class="demo initial">border: intial;</div>
    <div class="demo unset">boder: unset;</div>
  </div>
</body>
</html>
