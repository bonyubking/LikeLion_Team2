<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>선택자 조합 우선순위 확인</title>
  <style>
    :where(h1, h2, h3){
      color : orange;

    }
    
    div:not(.outer) p{
      color : lime;
      
    }
  </style>
</head>
<body>
  <h1>111</h1>
  <h2>222</h2>
  <h3>333</h3>
  <div class="where">
    <p>이 문장은 외부 div 안에 있습니다.</p>
  </div>
  <div>
    <p>이 문장은 외부 div 밖에 있습니다.</p>
  </div>


</body>
</html>
