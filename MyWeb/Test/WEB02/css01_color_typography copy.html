<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>색상 및 글꼴 실습</title>

  <style>
  /* p 태그
   1. .note01 -> 노란색 배경, 왼쪽 테두리 골드색
   2. .note02 -> 하늘색 배경, 왼쪽 테두리 네이비
    3. .note03 ->  빨간 글씨, 텍스트 굵게
  */
  .note01 {
    background-color: #ffeb3b;
    border-left: 5px solid #ffd600;
    padding: 10px;
  }
  .note02 {
    background-color: #bbdefb;
    border-left: 5px solid #0d47a1;
    padding: 10px;
  }
  #main-title {
    color: #f44336;
    text-align: bold;
  }

  </style>


</head>
<body>
  <h1 id="main-title">글꼴과 색상</h1>
  <p class = "note01">이 문장은 기본 텍스트 스타일입니다.</p>
  <p class = "note02">이 문장은 기본 텍스트 스타일입니다.</p>
  <p class = "note03">이 문장은 기본 텍스트 스타일입니다.</p>
</body>
</html>
