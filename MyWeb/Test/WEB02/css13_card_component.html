<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카드 컴포넌트</title>
  <style>
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      width: 200px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>카드 제목</h3>
    <p>이곳은 카드 내용입니다.</p>
  </div>
</body>
</html>
