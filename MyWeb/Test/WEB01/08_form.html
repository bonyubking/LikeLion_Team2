<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<title>폼 태그</title>
</head>

<body>
<form method = "get" action = "myHandle" onsubmit = "myHandle(event)">
  <label>이름: <input type="text" name= "myname"></label><br>
  <label>비밀번호: <input type="password" name="mypw"></label><br>
  <label>자기소개: <textarea name = "myres">

  </textarea></label><br>
  <input type="submit" value="제출">

<script>
  function myHandle(e){
    e.preventDefault();
    alert("제출 완료" + "\n이름: " + document.querySelector("input[name='myname']").value);
    console.log("이름: " + document.querySelector("input[name='myname']").value);
  }
</script>
</form>
</body></html>
