<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
  <title>Radio & Checkbox</title>
<style>
  label.selected{
    color : red;
    background-color: aqua;
  }
</style>
</head>


<body>

<form action = "#' method = "get">
  <p>성별:</p>
  <label class = "selected"><input type="radio" name="gender" value="male" onclick="myfunc(event)"> 남성</label>
  <label><input type="radio" name="gender" value="female"> 여성</label>

  <p>관심 분야:</p>
  <label><input type="checkbox" name="area" value="html"> HTML</label>
  <label><input type="checkbox" name="area" value="css"> CSS</label>
  <label><input type="checkbox" name="area" value="js"> JavaScript</label>

  <button type="submit">제출</button>
</form>

<script>
  function myfunc(e){
    console.log(e.target.value);

    const label = e.target.parentNode;
    label.textContent = "선택 했어!";
 
  }
</script>
</body>
</html>
