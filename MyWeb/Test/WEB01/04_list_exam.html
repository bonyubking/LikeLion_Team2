<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>리스트 태그</title>
    <style>
        ul.icon li::before{
            content: "▶";
        }

        li{
            color : blue;
            margin-bottom : 10px;
        }
        
        ol{
            list-style-type: lower-roman;
        }

    </style>

</head>

<body>
<h3>순서 없는 리스트</h3>
<ul class = "icon"><li>HTML</li>
    <li>CSS</li>
    <li>JS</li>
</ul>

<h3>순서 있는 리스트</h3>
<ol><li>기획</li>
    <li>설계</li>
    <li>구현</li>
</ol>

<h3>중첩 리스트</h3>
<ol>
    <li>기획</li>
    <li>설계</li>
    <li>구현</li>
    <li> 목록
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JS</li>
        </ul>
    </li>
</ol>
</body></html>
