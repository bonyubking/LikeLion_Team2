<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>여백과 테두리</title>
  <style>
    .box {
      margin: 30px;
      /*
      margin: 10px 20px -> 
      margin 
      */
      padding: 20px;
      border: 2px dashed #888;
      background-color: #e0f7fa;

      padding: 20px;
      border: 2px dashed #888;
      background-color: #e0f7fa;

      /*
      border: inherit; -> 부모 속성 상속 
      border: initial; -> 초기값으로 초기화 
      border: unset; -> 상황에 따라 상속, 초기화 진행 
      
      */
    }
  </style>
</head>
<body>
  <div class="box">여백(margin), 패딩(padding), 테두리(border)를 확인하세요.</div>
</body>
</html>
