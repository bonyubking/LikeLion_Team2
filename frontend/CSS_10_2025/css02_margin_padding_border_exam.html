<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>여백과 테두리</title>
  <style>
    .parent {
      margin: 30px;
      padding: 20px;
      border: 2px dashed #888;
      background-color: #e0f7fa;

      visibility: visible;
    }

    .inherit{
      border:inherit;
    }

    .initial{
      border:initial;
    }
    .unset{
      border: unset;
    }
    .demo{
      padding: 10px; 
      margin: 10;
      background-color: rgb(247,28,156);
    }
  </style>
</head>
<body>
  <div class="parent">
    <div class="demo inherit">border:inherit; 부모 border 상속 확인</div>
    <div class="demo initial">border:initial; 브라우저 기본값</div>
    <div class="demo unset">border:unset; 상속불가 -> 기본값으로 적용됨</div>
  </div>
</body>
</html>
