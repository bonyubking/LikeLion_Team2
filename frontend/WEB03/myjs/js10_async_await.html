<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>async/await</title>
  </head>
  <body>
    <ul id="users"></ul>
    <script>
      //비동기 코드를 동기적인 스타일로 작성할 수 있게 해줌 async/await
      //await 키워드를 만나면 비동기 완료될 때까지의 함수 실행을 일시 중단하고 완료되면 결과를 리턴해줌 
      async function loadUsers() {
        console.log('fetch  시작전');
        const res = await fetch('https://jsonplaceholder.typicode.com/users');
        console.log('fetch  완료후');
        const users = await res.json();
        console.log('json 변환 완료');
        users.slice(0, 3).forEach((user) => {
          const li = document.createElement('li');
          li.textContent = user.name;
          document.getElementById('users').appendChild(li);
        });
        console.log(`${users[0].name} 추가됨`);
      }
      console.log('loadUsers 호출 전');
      loadUsers();
    </script>
  </body>
</html>
