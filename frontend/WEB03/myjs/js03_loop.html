<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>반복문</title>
  </head>
  <body>
    <button id="myButton" onclick="Test()">확인</button><br>
    <div id="result"></div>

    <script>
      const resultDiv = document.getElementById("result");
      const myButton = document.getElementById("myButton");

      function Test(){
        resultDiv.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
          document.write('반복 ' + i + '<br>');
        }
      }
      myButton.addEventListener('click',Test); // 버튼을 클릭했을 때 Test라는 함수를 이벤트 리스너르 등록함

      web
    </script>
  </body>
</html>
